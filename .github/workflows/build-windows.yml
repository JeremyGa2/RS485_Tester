name: Build Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.11.1 pillow

      - name: Auto-tests du moteur
        run: python RS485_COM_tester_V6.py --selftest

      - name: Icone
        run: python tools/make_icon.py

      - name: Verification interface (sources) + captures
        timeout-minutes: 5
        run: |
          mkdir shots
          python RS485_COM_tester_V6.py --smoke "$PWD\smoke_src.json" "$PWD\shots"
          Get-Content smoke_src.json
          python -c "import json,sys; r=json.load(open('smoke_src.json',encoding='utf-8')); sys.exit(0 if r['ok'] else 1)"

      - name: Construction du .exe (dossier autonome)
        run: pyinstaller --noconfirm --clean RS485_COM_tester_V6.spec

      - name: Verification du .exe construit
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath "dist\RS485_Tester\RS485_Tester.exe" -ArgumentList "--smoke","$PWD\smoke_exe.json" -PassThru
          Wait-Process -Id $p.Id -Timeout 240
          Get-Content smoke_exe.json
          python -c "import json,sys; r=json.load(open('smoke_exe.json',encoding='utf-8')); sys.exit(0 if r['ok'] else 1)"

      - name: Assemblage du dossier pret a l'emploi
        run: |
          New-Item -ItemType Directory -Force -Path "package\RS485_Tester_V6" | Out-Null
          Copy-Item -Recurse "dist\RS485_Tester\*" "package\RS485_Tester_V6\"
          Copy-Item "LISEZ-MOI.txt" "package\RS485_Tester_V6\"
          Get-ChildItem "package\RS485_Tester_V6"

      - name: Publication (release privee du depot)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (Test-Path "package\RS485_Tester_V6") { Compress-Archive -Path "package\RS485_Tester_V6" -DestinationPath "RS485_Tester_V6.zip" -Force }
          New-Item -ItemType Directory -Force -Path verif | Out-Null
          if (Test-Path shots) { Copy-Item -Recurse shots verif\ }
          Copy-Item smoke_*.json verif\ -ErrorAction SilentlyContinue
          Compress-Archive -Path "verif\*" -DestinationPath "verification.zip" -Force
          $files = @("verification.zip")
          if (Test-Path "RS485_Tester_V6.zip") { $files += "RS485_Tester_V6.zip" }
          gh release create "build-${{ github.run_number }}" $files --title "Build ${{ github.run_number }}" --notes "Dossier pret a l'emploi : RS485_Tester_V6.zip" --target "${{ github.sha }}"
